services:
  postgres:
    image: postgres:16-alpine
    container_name: capsloc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capsloc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capsloc_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-capsloc_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-capsloc_admin} -d ${POSTGRES_DB:-capsloc_prod}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      target: server-runner
    container_name: capsloc_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-capsloc_admin}:${POSTGRES_PASSWORD:-capsloc_secure_password_2026}@postgres:5432/${POSTGRES_DB:-capsloc_prod}?schema=public"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-capsloc_prod_access_secret_super_secure_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-capsloc_prod_refresh_secret_super_secure_key_2026}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    expose:
      - "3000"
    volumes:
      - server_uploads:/app/apps/server/uploads

  client:
    build:
      context: .
      target: client-runner
    container_name: capsloc_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-80}:80"

volumes:
  postgres_data:
  server_uploads:
